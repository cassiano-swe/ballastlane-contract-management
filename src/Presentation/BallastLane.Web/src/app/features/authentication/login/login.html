<div class="login">
  <h1 id="login-title">Sign in</h1>
  <p>Use your BallastLane account to open the workspace.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="pending()" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username"
             maxlength="254" [readonly]="pending()" required />
      <mat-error>Enter a valid email address.</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput id="login-password" [type]="showPassword() ? 'text' : 'password'"
             formControlName="password" autocomplete="current-password" maxlength="1024"
             [readonly]="pending()" required />
      <button mat-button matSuffix type="button" aria-controls="login-password"
              (click)="togglePassword()">
        {{ showPassword() ? 'Hide' : 'Show' }} password
      </button>
      <mat-error>Enter your password.</mat-error>
    </mat-form-field>
    <div class="feedback" role="alert">{{ feedback() }}</div>
    <button mat-flat-button type="submit" [disabled]="busy()">
      {{ pending() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
